name: Ubuntu 22.04 Cloud Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Configure SSH
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$SSH_PUBLIC_KEY" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

          sudo systemctl enable ssh
          sudo systemctl start ssh

          echo "=========================================="
          echo " Ubuntu 22.04 SERVER IS READY"
          echo "=========================================="
          echo "SSH user:"
          whoami
          echo "=========================================="

      - name: Start Free Tunnel (Pinggy)
        run: |
          # هذه الخطوة تفتح نفق مجاني للبورت 22 (SSH) وتطلع لك رابط مباشر باللوغ (Logs)
          echo "Starting free tunnel to access server..."
          curl -sL https://pinggy.io/link | sh > tunnel.log 2>&1 &
          sleep 5
          cat tunnel.log || echo "Tunnel starting in background..."

      - name: Keep Server Alive
        run: |
          for i in $(seq 1 350); do
            sleep 60
            echo "[$i/350] Ubuntu server running..."
          done
