name: Ubuntu 22.04 Cloud Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Configure SSH
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$SSH_PUBLIC_KEY" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

          sudo systemctl enable ssh
          sudo systemctl start ssh

          echo "=========================================="
          echo " Ubuntu 22.04 SERVER IS READY"
          echo "=========================================="
          echo "SSH user:"
          whoami
          echo "=========================================="

      - name: Start Free Tunnel (Localtunnel)
        run: |
          sudo npm install -g localtunnel > /dev/null 2>&1
          nohup lt --port 22 > lt.log 2>&1 &
          sleep 4
          cat lt.log

      - name: Keep Server Alive
        run: |
          for i in $(seq 1 350); do
            sleep 60
            echo "[$i/350] Ubuntu server running..."
          done
