name: Ubuntu 22.04 Cloud Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Configure SSH
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$SSH_PUBLIC_KEY" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

          sudo systemctl enable ssh
          sudo systemctl start ssh

          echo "=========================================="
          echo " Ubuntu 22.04 SERVER IS READY"
          echo "=========================================="
          echo "SSH user:"
          whoami
          echo "=========================================="

      - name: Install Bore Tunnel
        run: |
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz -o bore.tar.gz
          tar -xvf bore.tar.gz
          sudo mv bore /usr/local/bin/

      - name: Start Tunnel (Bore)
        run: |
          nohup bore local 22 --to bore.pub > bore.log 2>&1 &
          sleep 3
          cat bore.log

      - name: Keep Server Alive
        run: |
          for i in $(seq 1 350); do
            sleep 60
            echo "[$i/350] Ubuntu server running..."
          done
